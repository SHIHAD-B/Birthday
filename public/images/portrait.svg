<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151B30"/>
      <stop offset="55%" stop-color="#24172E"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#D9A5AD" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#D9A5AD" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
  <circle cx="400" cy="380" r="110" fill="#E8C89E" fill-opacity="0.18"/>
  <circle cx="400" cy="360" r="70" fill="#FFF6ED" fill-opacity="0.2"/>
