  <text x="400" y="780" text-anchor="middle" fill="#E8C89E" font-family="Georgia, serif" font-size="36">Your Photo</text>
  <text x="400" y="830" text-anchor="middle" fill="#B8AEC5" font-family="Georgia, serif" font-size="20">Replace /public/images/portrait.jpg</text>
</svg>
